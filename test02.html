<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서 유/무에 따른 목록 만들기</title>
</head>
<body>
    <!-- <ol> <li> ~ </li> </ol> -->
    <!-- ol은 순서가 있는 목록을 의미. -->
    <!-- <ol></ol> 태그는 <li></li> 이외의 어떤 태그도 자식으로 가질 수 없다. -->
    <ol type="A" start="3">
        <li>HTML, <strong style="color:blue;">CSS</strong>, JavaScript</li>
        <li>HTML, <strong style="color:blue;">CSS</strong>, JavaScript</li>
    </ol>

    <!-- <ul> <li> ~ </li> </ul> -->
    <!-- ou은 순서가 없는 목록을 의미. -->
    <!-- <ul></ul> 태그는 <li></li> 이외의 어떤 태그도 자식으로 가질 수 없다. -->
    <ul>
        <li>Java, Python, C+, MySQL</li>
        <li>코딩은 재미있어!!</li>
    </ul>
    <ul>
        <li>메인 리스트1
            <ul>
                <li>서브 리스트1</li>
                <li>서브 리스트2</li>
            </ul>            
        </li>
    </ul>

    <hr/>

    <ol>
        <li>채소
            <ul>
                <li>친환경</li>
                <li>고구마/감자/당근</li>
            </ul>
        </li>
        <li>과일/견과/쌀</li>
        <li>해산/건어물</li>
        <li>정육/계란</li>
    </ol>

    <hr/>

    <!-- <a herf="이동할 주소 지정"> 텍스트</a> 
            => 이동 할 주소로 이동하는 가장 기본적인 태그
    -->
    <!-- <a> 태그의 title 속성은 사용자의 접근성을 위해 작성하는 것이 좋다. -->
    <!-- <img/> 태그의 src 속성은 반드시 상대경로 방식으로 지정한다!!! -->
    <ul>
        <li>
            <a href="https://naver.com" target="_blank" title="네이버 바로가기">
                <img src="images/search.svg" alt="네이버 아이콘" width="30px;" height="30px;"/>
            </a>
        </li>
        <li>
            <a href="https://daum.net" title="다음 바로가기">
                <img src="images/bird.svg" alt="다음 아이콘" width="30px;" height="30px;"/>
            </a>
        </li>
        <li>
            <a href="https://google.com" title="구글 바로가기">
                <img src="images/i-gnb.svg " alt="구글 아이콘" width="30px;" height="30px;"/>
            </a>
        </li>
    </ul>

</body>
</html>
