<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 가로배치하기</title>
    <style>
        .parent{
            border: 2px solid red;
            width: 600px;
            /* 3. overflow: hidden을 부모에 지정하면, 부모의 높이보다 자식의 높이가 넘쳐서 화면에 숨기고 싶다... 자식 높이와 같아짐*/
            /* overflow: hidden; */
            font-size: 50px;
            margin: auto;
            text-align: center;
        }

        .child{
            /* font-size: inherit; /* 부모의 font-size를 상속받는다. */
            width: 200px;
            height: 300px;
            background-color: gold;
            /* 1.float 의 right로 오른쪽정렬 */
            /*float: right; /* 2.자식에 float을 지정하면, 부모는 자식의 height 값을 잃음 */
            /* ㄱ.블록 요소에만  margin: auto; 사용 가능*/
            display: inline-block;
            text-align: left;
            
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child</div>
    </div>
</body>
</html>
