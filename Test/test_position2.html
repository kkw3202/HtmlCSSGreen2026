<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abbsolute 포지션</title>
    <!-- position 이 존재하지 않으면 top left 등 위치지정은 못함. -->
    <style>
        .parent{
            background-color: dodgerblue;
            width: 800px;
            height: 300px;
            position: relative;
        }
        .child{
            background-color: crimson;
            width: 200px;
            height: 100px;
            position: absolute;
            right: 50px;
            bottom: 50px;
        }
       

        .parent02{
            border: 1px solid red;
            width: 600px;
            height: 300px;
            margin: 0 auto;
            position: relative;
        }

        .parent02 .box{
            width: 100px;
            height: 100px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            border: 1px solid dodgerblue;
            display: inline-block;
            position: absolute;
            background-color: orange;
            box-shadow: 5px 5px 10px black;
        }
        /* 부모 안 */
        .inline-top-left{
            top: 0;
            left: 0;
        }

        .inline-top-right{
            top: 0;
            right: 0;
        }

        .inline-bottom-left{
            bottom: 0;
            left: 0;
        }

        .inline-bottom-right{
            bottom: 0;
            right: 0;
        }

        .parent02 .center{
            background-color: crimson;
            top: 50%;
            left: 50%;
            /* 위의 경우, 윗면과 좌측면이 만나는 꼭짓점이 정중앙으로 이동 */
            transform: translate(-50%, -50%);
            /* transform: 모양을 변경
            translate: (x축,y축) 이동*/
        }

        /* 부모 밖 */
        .parent02 .child1{
            background-color: dodgerblue;
            top: 100%; /* =top: 부모 height, top는 박스의 윗쪽 면이 기준이어서 밖으로 나감. */
            left: 0;
            font-size: 24px;
        }

        .parent02 .child2{
            background-color: dodgerblue;
            top: 0; 
            left: 100%; /* =left: 부모 height, top는 박스의 윗쪽 면이 기준이어서 밖으로 나감. */
            font-size: 24px;
        }

        .parent02 .child3{
            background-color: dodgerblue;
            top: 100%; 
            left: 100%;
            font-size: 24px;
        }

    </style>
</head>
<body>
   <div class="parent">
        <div class="child"></div>
   </div>

   <hr />

   <div class="parent02">
        <div class="box inline-top-left">top:0<br/>left:0</div>
        <div class="box inline-top-right">top:0<br/>right:0</div>
        <div class="box inline-bottom-left">bottom:0<br/>left:0</div>
        <div class="box inline-bottom-right">bottom:0<br/>right:0</div>
        <div class="box center">center</div>

        <div class="box child1">1</div>
        <div class="box child2">2</div>
        <div class="box child3">3</div>
   </div>

</body>
</html>
