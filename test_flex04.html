<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 연습04</title>
    <style>
        .container{
            display: flex;
            width: 600px;
            height: 200px;
            border: 3px solid #333;
            background-color: #f4f4f4;
            margin: 20px auto;
        }

        .container .box{
            width: 100px;
            height: 100px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            background-color: coral;
            text-align: center;
            line-height: 50px;
        }

        .container .box1{
            background-color: #e74c3c;
            order: -1;
            /* 기본값인 0보다 작아서 HTML의 순서와 무관하게 맨 앞으로 이동 */
        }
        .container .box2{
            /* 남은 여백을 2비율로 차지 */
            flex-grow: 2;
            background-color: dodgerblue;
        }
        .container .box3{
            /* 남은 여백을 2비율로 차지 */
            flex-grow: 1;
            background-color: blueviolet;
        }
        .container .box4{
            /* 부모의 정렬의 무시하고 혼자 맨 아래(세로)로 정렬됨 */
            align-self: flex-end;
            background-color: brown;
        }
    </style>
</head>
<body>
    <!--
        aligin-content 속성은 자식요소들이 줄바꿈되어 2줄 이상일 때,
        줄 단위로 정렬하는 속성

        aligin-items : 아이템(=자식요소들)이 한 줄 로 있을 때
        aligin-content : 아이템(=자식요소들)이 2줄 이상(flex-wrap: wrap 로) 되었을 때, 전체 줄 덩어리를 정렬하는 속성
    -->
    <div class="container">
        <div class="box box1">box1<br/>(order -1)</div>
        <div class="box box2">box2<br/>(grow 2)</div>
        <div class="box box3">box3<br/>(grow 1)</div>
        <div class="box box4">box4<br/>(self end)</div>
    </div>
</body>
</html>
