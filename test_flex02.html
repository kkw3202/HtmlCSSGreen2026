<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 연습02</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            width: 500px;
            /* 부모의 width가 자식요소 전체보다 작으면 자식이 자동으로 줄어듦. 
            이를 방지하기 위해 자동개행 속성을 지정.
            flexwrap: wrap : 자동개행 || nowrap: 자동 개행 안함(default)
            */
            flex-wrap: wrap;
            /* height: 500px; */
            border: 1px solid blue;
            /* 자식요소를 부모요소의 가운데로 배치한다. */
            /* justify : space-around : 요소의 시작과 끝을 기준으로 공백지정*/
            /* justify : space-between : 요소와 요소 사이 공백을 일정하게 지정*/
            /* justify : space-evenly : 요소들 사이의 공백을 공평하게 지정*/

            justify-content: space-between;
            margin: 0 auto;
        }

        .container .box{
            width: 100px;
            height: 100px;
            border: 1px solid red;
            border-radius: 5px;
            margin: 5px;
            color: white;
            background-color: crimson;
        }
    </style>
</head>
<body>
    <!--
    
    -->
    <div class="container">
        <div class="box">box1</div>
        <!-- <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
        <div class="box">box6</div>
        <div class="box">box7</div> -->
        <div class="box">box8</div>

    </div>
</body>
</html>
