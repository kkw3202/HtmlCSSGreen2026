<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section class="login_window">
        <!-- 로그인 메인부 -->
        <div class="login_main">
            <!-- 타이틀 -->
            <h2 class="logo">OOZY COFFEE</h2>
            <!-- 로그인 인픗부 -->
            <div class="login_input">
                <!-- 폼태그 전송부 -->
                <form action="#" method="post">
                    <!-- 이메일, 비번 입력부 -->
                    <input type="email" name="user_email" placeholder="이메일을입력해 주세요."/>
                    <input type="password" name="user_pw" placeholder="비밀번호를 입력해 주세요."/>
                    <!-- 로그인 버튼 -->
                    <button type="submit">로그인</button>
                </form>
            </div>
            <!-- 상태 유지 및 계정 찾기부 -->
            <div class="login_assist">
                <!-- 로그인 상태 유지 체크박스 -->
                <input type="checkbox" id="login_keep"/>
                <label for="login_keep">로그인 상태 유지</label>
                <!-- 아이디 · 비밀번호 찾기 링크 -->
                <a href="#">아이디 · 비밀번호 찾기</a>
            </div>
        </div>

        <!-- 외부 연결부 -->
        <div class="login_linked">
            <p>SNS 간편 로그인</p>
            <!-- sns 로그인 -->
            <ul class="login_sns">
                <li class="login_naver"><a href="#"><img src="images/sns_naver.svg" alt="네이버 로그인"></a></li>
                <li class="login_kakao"><a href="#"><img src="images/sns_kakao.svg" alt="카카오 로그인"></a></li>
                <li class="login_facebook"><a href="#"><img src="images/sns_facebook.svg" alt="페이스북 로그인"></a></li>
                <li class="login_google"><a href="#"><img src="images/sns_google.svg" alt="구글 로그인"></a></li>
                <li class="login_apple"><a href="#"><img src="images/sns_apple.svg" alt="에플 로그인"></a></li>
            </ul>
        </div>

        <div class="login_etc">
            <!-- 회원가입 -->
            <a href="member.html" target="_self">회원가입</a>
            <!-- 홍보문구 -->
            <p>회원가입하면 <strong>10만원 쿠폰팩</strong>을 드려요!</p>
        </div>
    </section>
</body>
</html>
