<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="member.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section class="join_window">
        <!-- 로고 및 홍보 문구 -->
        <div class="join_top">
            <!-- 로고 -->
            <h2 class="logo">OOZY COFFEE</h2>
            <!-- 회원가입 문구 -->
            <h3>회원가입</h3>
            <!-- 홍보 문구 -->
            <p>회원가입하면 <strong>10만원 쿠폰팩</strong>을 드려요!</p>
        </div>

        <!-- 폼태그, 회원정보 입력 -->
        <div class="join_main">
            <form action="#" method="post">
                <ul>
                    <!-- 이메일* -->
                    <li>
                        <label for="user_email">이메일<span>*</span></label>
                        <input id="user_email" type="email" name="user_email" placeholder="이메일을 입력해 주세요"/>
                        <!-- 이메일 중복확인 -->
                        <button type="button">중복확인</button>
                    </li>
                    <!-- 비밀번호* -->
                    <li>
                        <label for="user_pw">비밀번호<span>*</span></label>
                        <input id="user_pw" type="password" name="user_pw" placeholder="비밀번호를 입력해 주세요"/>
                    </li>
                    <!-- 비밀번호 확인* -->
                    <li>
                        <label for="user_pwchk">비밀번호 확인<span>*</span></label>
                        <input id="user_pwchk" type="password" placeholder="비밀번호를 한 번 더 입력해 주세요"/>
                    </li>
                    <!-- 이름* -->
                    <li>
                        <label for="user_name">이름<span>*</span></label>
                        <input id="user_name" type="text" name="user_name" placeholder="이름을 입력해 주세요"/>
                    </li>
                    <!-- 휴대폰 번호* -->
                    <li>
                        <label for="user_tel">휴대폰 번호<span>*</span></label>
                        <input id="user_tel" type="tel" name="user_tel" placeholder="010-0000-0000"/>
                        <!-- 인증번호 받기 -->
                        <button type="button">인증번호 받기</button>
                    </li>
                    <!-- 생년월일 (선택) -->
                    <li>
                        <label for="user_birth">생년월일<span class="join_choose">&nbsp;(선택)</span></label>
                        <input id="user_birth" type="date" name="user_birth"/>
                    </li>
                    <!-- 성별 (선택)-->
                    <li>
                        <label for="gender_noinfo">성별<span class="join_choose">&nbsp;(선택)</span></label>
                        <!-- 여성 -->
                        <div class="gender_female">
                            <input id="gender_female" type="radio" name="user_gender"/>
                            <label for="gender_female" class="join_gender">여성</label>
                        </div>
                        <!-- 남성 -->
                        <div class="gender_male">
                            <input id="gender_male" type="radio" name="user_gender"/>
                            <label for="gender_male" class="join_gender">남성</label>
                        </div>
                        <!-- 선택안함 -->
                        <div class="gender_noinfo">
                            <input id="gender_noinfo" type="radio" name="user_gender" checked/>
                            <label for="gender_noinfo" class="join_gender">선택 안함</label>
                        </div>
                    </li>
                </ul>
                
                <!-- 약관동의 -->
                <div class="join_agreement">
                    <!-- 전체동의 -->
                    <div class="all_agree_wrap">
                        <label for="all_agree" class="agree_title">약관동의</label>
                        <input id="all_agree" type="checkbox"/>
                        <label for="all_agree">전체 동의하기</label>
                    </div>
                    <!-- 동의묶음1 -->
                    <div class="default_agree_wrap">
                        <!-- [필수] 이용약관 동의 -->
                        <input id="default_agree" type="checkbox"/>
                        <label for="default_agree"><span>[필수]</span>이용약관 동의</label>
                        <!-- 보기 -->
                        <a href="#">보기</a>
                    </div>

                    <!-- 동의묶음2 -->
                    <div class="personal_agree_wrap">
                        <!-- [필수] 개인정보 수집 맟 이용 동의 -->
                        <input id="personal_agree" type="checkbox"/>
                        <label for="personal_agree"><span>[필수]</span>개인정보 수집 맟 이용 동의</label>
                        <!-- 보기 -->
                        <a href="#">보기</a>
                    </div>

                    <!-- [필수] 만 14세 이상입니다 -->
                    <div class="upper14_agree_wrap">
                        <input id="upper14_agree" type="checkbox"/>
                        <label for="upper14_agree"><span>[필수]</span>만 14세 이상입니다</label>
                    </div>

                    <!-- 동의묶음3 -->
                    <div class="event_agree_wrap">
                        <!-- [선택] 이벤트·혜택 정보 수신 동의 -->
                        <input id="event_agree" type="checkbox"/>
                        <label for="event_agree"><span class="join_choose">[선택]</span>개인정보 수집 맟 이용 동의</label>
                        <!-- 보기 -->
                        <a href="#">보기</a>
                    </div>
                </div>

                <!-- 가입하기(버튼) -->
                <button type="submit">가입하기</button>

            <!-- 폼 종료 -->
            </form> 
        </div>

            <!-- <css로 border-bottom 그리기> -->

        <div class="etc">
            <!-- 이미 회원이신가요? -->
            <p>이미 회원이신가요?</p>
            <!-- 로그인(링크) -->
            <a href="login.html" target="_self">로그인</a>
        </div>
    </section>
</body>
</html>
