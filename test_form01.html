<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 연습</title>
</head>
<body>
    <!-- <form> 태그란 =>사용자가 입력한 자료를 서버로 전송하고자 할 때 사용하는 가장 대표적인 태그. 
         <form> 태그 안의 action 속성은 서버의 URL을 입력.    
         <form> 태그 안의 method 속성은 자료를 서버로 넘길 때, 어떤 방식으로 넘길지 선택하는 속성이다.
            1) POST : 사용자가 입력한 내용이 드러나지 않는다.
            2) GET : 사용자가 입력한 내용이 모두 보인다.

    -->

    <form action = "#" method="GET"> 
        <!-- <input/> : <form>태그 안에 자료를 입력하는 태그
            단, input 태그는 단독태그로, /> 해주는것에 유의.
            input 태그의 type속성은 입력하는 자료의 자료형을 구분해준다.
            ** input 태그는 인라인태그다 => 높이(세로정렬?)를 가질 수 없다.

            +a input 태그의 readonly 속성은 입력불가. 읽기만 가능하게 함.
        -->
        <label>사용자 ID : <input type="text" /></label><br/>
        <label for="pw">비밀번호 : </label> <input type="password" id="pw"/> <br/>
        <label for = "mail">이메일</label> <input type="email" id="mail"/> <br/>
        <label>URL 입력 : </label>
        <input type="url" placeholder="https://" /><br/>
        <label>전화번호 입력 : </label>
        <input type="tel" placeholder="010-xxxx-xxxx" /><br/>
        <label>검색 : </label>
        <input type="search" placeholder="검색어 입력" /><br/>


        <!-- input 태그의 type 속성중 submit은 입력한 자료를 서버로 전송하는 역할을 한다.-->
        <input type="submit" value="완료" />
        
    </form>

    <!-- <fieldset> 태그를 이용한 form 작성하기 -->
    <form>
        <fieldset>
            <legend>로그인 정보</legend>
            <label>아이디</label><input type="text"><br/>
            <label>비밀번호</label><input type="password"><br/>
        </fieldset>
        <fieldset>
            <legend>회원정보</legend>
            <label>취미/특기</label><input type="text"><br/>
        </fieldset>
    </form>

    <!-- <input> 태그의 checkbox type 속성은 동시에 여러 개를 선택 할 수 있는 체크박스이다.
         <input type = "checkbox" checked /> ...checked는 기본적으로 체크박스 하나를 선택했다는 의미. 
         checkbox 나 radio 는 반드시 name 를 지정하여 하나의 그룹임을 알려야 한다.
    -->
        <from>
            <input type="checkbox" value="1" name="hobby" checked /> 게임
            <input type="checkbox" value="2" name="hobby" /> 영화
            <input type="checkbox" value="3" name="hobby" /> 음악
        </from>
        <from>
            <input type="radio" name="school" checked/> 초등
            <input type="radio" name="school" /> 중등
            <input type="radio" name="school" /> 고등 <br/>
            <label for="conment"></label>
            <textarea cols="4" rows="4"></textarea>
        </from>

        <!-- <select>태그는 드롭다운 메뉴로 메뉴를 선택 할 때 사용한다.
            단, 반드시 <option> 태그와 같이 사용한다. -->
        <form>
            <select>
                <option value="" disabled>Family Site</option>
                <option value="건축사무소" >건축사무소</option>
                <option value="시공사무소" >시공사무소</option>
                <option value="설계사무소" >설계사무소</option>
            </select>
        </form>

        <!-- 
            datalite : select와 같지만... 
            - 사용자가 직접 입력할 수 있다.
            - 키보드로 입력하면 해당 글자가 들어간 항목만 필터링된다.
            - <input>태그에 추천 옵션을 제공하는 방식으로 작성한다.
            - <input list="ID" />, <datalist id=:"ID"> 와 같이 연동해서 사용한다.
            - ** <label for="ID2"> 라면, for 의 값과 list 의 값은 **반드시** 달라야한다!!
            사용 예시는 ex_form02 참조
        -->
        
        <!-- 
            <button> 태그의 type 종류 : submit(전송), reset(취소), button(단순 버튼)
        -->
        <lable>전송버튼</lable>
        <button type="submit">전송1</button>
        <button type="reset">취소1</button>
        <button type="button">그냥 버튼</button>
        
</body>
</html>
