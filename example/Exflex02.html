<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card-container{
            display: flex;
            width: 100%;
            justify-content: space-between;
        }

        .card-container .card{
            width: 33%;
            height: 7rem;
            background-color: dodgerblue;
            border-radius: 5px;
            color: #fff;
            text-align: center;

            /* display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            align-content: center; */
            padding-top: 2rem ;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h3>Card 1</h3>
            <p>첫 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>두 번째 카드 설명입니다.</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>세 번째 카드 설명입니다.</p>
        </div>
    </div>
</body>
</html>
