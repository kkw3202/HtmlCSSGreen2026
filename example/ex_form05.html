<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제05</title>
    <!-- ex_form05.css 파일을 링크로 연결 -->
     <link rel="stylesheet" href="/styleCss/ex_form05.css">
</head>
<body>
    <h3>여름방학 특강 신청하기</h3>
    <form>
        <fieldset>
            <legend>교육과정</legend>
            <ul>
                <li class="level">
                    <label class="title">영어회화</label>
                    <input type="text" readonly value="오전 9:00~11:00" name="engtalk" />
                    <span>(초급레벨)</span>
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>신청자 기본 정보</legend>
            <ul>
                <li>
                    <label class="title" for="name">이름</label>
                    <input type="text" placeholder="예) 홍길동" name="user_name" id="name"/>
                </li>
                <li>
                    <label class="title" for="email">이메일</label>
                    <input type="email" placeholder="예) example@exam.com" name="user_email" id="email"/>
                </li>
                <li>
                    <label class="title" for="password">비밀번호</label>
                    <input type="password" placeholder="비밀번호를 입력하세요" name="user_pw" id="password"/>
                </li>
                <li>
                    <label class="title" for="dep">학과</label>
                    <select>
                        <option value="">학과를 선택하세요</option>
                        <option name="user_dep" value="컴퓨터공학과">컴퓨터공학과</option>
                        <option name="user_dep" value="국어국문학과">국어국문학과</option>
                        <option name="user_dep" value="영어영문학과">영어영문학과</option>
                        <option name="user_dep" value="전자융합과">전자융합과</option>
                    </select>
                </li>
                <li class="gender_item">
                    <span class="title">성별</span>
                    <input type="radio" name="user_gender" value="남자" id="male"/>
                    <label for="male">남자</label>
                    <input type="radio" name="user_gender" value="여자" id="frmale"/>
                    <label for="female">여자</label>
                </li>
                <li class="hobby_item">
                    <span class="title">취미</span>
                    <input type="checkbox" name="user_hobby" id="hobby1" />
                    <label for="hobby1">여행</label>

                    <input type="checkbox" name="user_hobby" id="hobby2" />
                    <label for="hobby2">게임</label>

                    <input type="checkbox" name="user_hobby" id="hobby3" />
                    <label for="hobby3">공연</label>

                    <input type="checkbox" name="user_hobby" id="hobby4" />
                    <label for="hobby4">운동</label>
                    
                    <input type="checkbox" name="user_hobby" id="hobby5" />
                    <label for="hobby5">기타</label>
                </li>
            </ul>
        </fieldset>
        <!-- 의미없는 태그 <div> 이용 : 그룹을 묶을 때 유용함.-->
            <div class="btn">
                <button type="submit">수강신청</button>
                <button type="reset">다시쓰기</button>
            </div>
    </form>
</body>
</html>
