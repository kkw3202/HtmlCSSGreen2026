<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제 11</title>
    <style>
        *{
            list-style: none;
            border: 0;
            padding: 0;
        }
        h1{
            border-radius: 10px;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
            /* border: 1px solid #0c0c0c; */
            width: 600px;
            padding: 10px;
            text-align: center;
            color: #fff;
            background-color: #0c0c0c;
        }
        li{
            margin: 10px;
            font-size: 16px;
        }
        span{
            text-decoration: underline;
            color:blue;
            font-weight: bolder;
        }
        label{
            font-weight: 450;
        }
    </style>
</head>
<body>
    <h1>Best Coffe Beans of the World</h1>
    <ul>
        <li>
            <span>Ethiopia Yirgacheffe</span>
            <label>: Known for its bright acidity and floral, citrus notes.</label>
        </li>
        <li>
            <span>Colombia Supremo</span>
            <label>Bakanced flavor with a nutty, caramel sweetness.</label>
        </li>
        <li>
            <span>Guatemala Antigua</span>
            <label>Rich body with smoky, chococlate undertones.</label>
        </li>
    </ul>
</body>
</html>
