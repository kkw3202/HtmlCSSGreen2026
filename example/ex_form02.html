<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼 연습문제 02</title>
    <style>
        body{
            font-family:sans-serif;
            font-size:14px;
        }
        h1{
            margin-bottom : 20px;
        }
        ul{
            /* li 앞에 붙는 기호 삭제 */
            list-style : none;
            padding-left: 0px;
            margin:0px;
        }
        ul li{
            margin-bottom : 10px;
        }
        textarea{
            width:300px;
            height:80px;
            margin-top: 5px;
        }
        label{
            /* 글꼴을 굵게 */
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>간단한 설문</h1>
    <form action="#" method="get">
        <ul>
            <li><label for="fruit">좋아하는 과일을 입력하세요</label>
                 <select id="fruit" name="fruit">
                    <option value="사과">사과</option>
                    <option value="바나나">바나나</option>
                    <option value="딸기">딸기</option>
                    <option value="포도">포도</option>
                </select>
            </li>
            <li>
                <label for="drink">좋아하는 음료 입력 : </label>
                <input type="text" id="drink" name="drink" list="list-drink" />
                <datalist id="list-drink">
                    <option value="콜라">콜라</option>  
                    <option value="사이다">사이다</option>
                    <option value="주스">주스</option>
                    <option value="커피">커피</option>
                </datalist>
            </li>
            <li>
                <label for="hobby">취미(복수 선택 가능) : </label>
                <input type="checkbox" name="hobby" value="독서" id="hobby"/>독서
                <input type="checkbox" name="hobby" value="운동" />운동
                <input type="checkbox" name="hobby" value="음악" />음악
                <input type="checkbox" name="hobby" value="여행" />여행
            </li>
            <li>
                <label for="gender">성별 선택</label>
                <input type="radio" name="gender" value="남성" id="gender"/>남성
                <input type="radio" name="gender" value="여성" />여성
            </li>
            <li>
                <label for="comment">추가 의견 : </label> <br />
                <textarea id="comment" name="comment" placeholder="의견을 입력하세요"></textarea>
            </li>
        </ul>
    </form>
</body>
</html>
