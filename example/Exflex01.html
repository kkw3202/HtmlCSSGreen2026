<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex 메뉴 만들기</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ul */
        .nav{
            display: flex;
            list-style: none;
            background-color: #c2c1c1;
            padding-left: 10rem;
            padding-right: 60rem;
            width: 120rem;
            justify-content: space-evenly;
            font-size: 1.5rem;
        }
        
        li{
            height: 2.4rem;
            line-height: 2.4rem;
        }

        a{
            color: black;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <body>
        <ul class="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
</body>
</body>
</html>
