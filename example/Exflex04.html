<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex연습문제04</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #f2f2f2;
        }

        .join_box{
            margin: 40px auto;
            background-color: #ffffff;
            width: 400px;
            border-radius: 5px;
            padding: 40px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.4);
        }

        .join_box form ul li{
            display: flex;
            justify-content: center;
            margin-bottom: 10px
        }

        .join_box form ul li label{
            width: 110px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .join_box form ul li input{
            padding: 5px 0 5px 10px;
            width: 250px;
        }

        .join_box form button{
            width: 320px;
            padding: 7px 0;
            background-color: rgb(0, 172, 0);
            border: none;
            border-radius: 5px;
            color: #f2f2f2;
            cursor: pointer;
            margin-top: 10px;
        }

        .join_box form button:hover{
            background-color: rgb(0, 136, 0);
        }
    </style>
</head>
<body>
    <div class="join_box">
        <form action="#" method="post">
            <ul class="signin_wrap"> 
                <li> <!-- flex -->
                    <label for="name">이름</label>
                    <input type="text" id="name" name="name" placeholder="홍길동"/>
                </li>
                <li>
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com"/>
                </li>
                <li>
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password"/>
                </li>
                <li>
                    <label for="password_chk">비밀번호 확인</label>
                    <input type="password" id="password_chk"/>
                </li>
                <li>
                    <button type="submit">회원가입</button>
                </li>
            </ul>
        </form>
    </div>
</body>
</html>
