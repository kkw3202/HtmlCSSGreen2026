<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 연습문제01</title>
    <style>
        table{
            border-collapse : collapse;
            width : 600px;
        }
        table caption{
            text-align : right;
        }
        thead th{
            background-color : green;
            color : #fff;
        }
        thead th,
        tbody td{
            border : 1px solid #555;
            text-align:center;
            padding-top : 5px;
            padding-bottom : 5px;
        }
    </style>
</head>
<body>
    <table>
        <caption><strong>(본사 정식 소비자 가격)</strong></caption>
        <thead>
            <tr>
                <th colspan="2">제품명</th>
                <th>★★★★★★★<br/>바텍스</th>
                <th>★★★★★<br/>레티튜드</th>
                <th>★★★★<br/>아티젠IB</th>
            </tr>
        </thead>
         <tbody>
            <tr>
                <td rowspan="2">국내차량</td>
                <td>썬루프</td>
                <td>150,000</td>
                <td>90,000</td>
                <td>170,000</td>
            </tr>
            <tr>
                <!-- 병합된 셀 -->
                <td>파노라마 썬루프</td>
                <td>330,000</td>
                <td>200,000</td>
                <td>170,000</td>
            </tr>
            <tr>
                <td rowspan="2">수입차량</td>
                <td>썬루프</td>
                <td>180,000</td>
                <td>110,000</td>
                <td>90,000</td>
            </tr>
            <tr>
                <!-- 병합된 셀 -->
                <td>파노라마 썬루프</td>
                <td>350,000</td>
                <td>240,000</td>
                <td>200,000</td>
            </tr>
         </tbody>
    </table>
   
    
</body>
</html>
