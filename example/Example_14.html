<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제14</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: sans-serif;
        }

        div.card_wrap{
            width: 1300;
            /*  */

            padding: 30px;
            text-align: center;
            margin-top: 50px;
            background-color: #eee;
        }
        div.card{
            display: inline-block;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            width: 300px;
            border-radius: 20px;
            margin: 0 15px;
        }
        div.card img{
            width: 300px;
            border-radius: 20px 20px 0 0;
        }

        p{
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 48px;
            border-radius: 0 0 20px 20px;
            padding: 0 20px;
            color: #333;
            font-size: 17px;
        }

        h2,
        P,
        div.card{
            background-color: #fff;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card_wrap">
        <div class="card">
            <img src="../images/product1.jpg"/>
            <h2>Wireless Earbuds</h2>
            <p>This is a long product description text that will be truncated</p>
        </div>

        <div class="card">
            <img src="../images/product2.jpg"/>
            <h2>Smart Watch</h2>
            <p>Track your health and fitness goals easily every single day</p>
        </div>

        <div class="card">
            <img src="../images/product3.jpg"/>
            <h2>Bluetooth Speaker</h2>
            <p>Portable speaker with powerful sound and long battery life</p>
        </div>
    </div>
</body>
</html>
