<!DOCTYPE html>
<html lang="o">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우지 header</title>
    <link rel="stylesheet" href="/styleCss/style_17.css">
</head>
<body>
    <!-- 
    시멘틱 태그 : HTML5에서 등장 한 개념. 의미있는 머릿말, 메뉴, 내용, 꼬리말 부분을 구분하는 태그.
    순서대로 header, nav, section, footer 로 명명.
    -->
    <header class="site_header">
        <!-- 로고 -->
        <div class="logo">
            <h1>OOZY COFFEE</h1>
        </div>
        <!-- 매뉴 -->
        <nav>
            <ul>
                <li>ABOUT US</li>
                <li>MENU</li>
                <li>STORE</li>
                <li>FRANCHISE</li>
                <li>COMMUNITY</li>
            </ul>
        </nav>
        <!-- 유틸 -->
        <div class="util">
            <span class="owner">점주님 공간</span>
            <button class="franchise_btn">프랜차이즈</button>
        </div>
    </header>
</body>
</html>
