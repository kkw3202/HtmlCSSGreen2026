<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습문제 13</title>
    <style>
        *{
            list-style: none;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        div.menu{
            width: 400px;
            padding: 20px;
            margin: 0 auto;
            border: 1px solid #969696;
            border-radius: 20px;
            background-color: #ebe1d0;
        }
        h1{
            letter-spacing: 6px;
            text-align: center;
            margin: 20px;
        }
        ul li{
            text-transform: uppercase;
            font-size: 20px;
            /* text-decoration: underline ; */
            border-bottom: 1.5px dashed #969696;
            margin-bottom: 5px;
            padding-bottom: 3px;
        }
        span{
            float: right;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Café Menu</h1>
        <ul>
            <li>americano<span>$3.50</span></li>
            <li>latte<span>$4.00</span></li>
            <li>cappuccino<span>$4.20</span></li>
        </ul>
    </div>
</body>
</html>
